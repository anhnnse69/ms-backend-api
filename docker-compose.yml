services:
  ms-api:
    image: ${DOCKER_REGISTRY-}msapi
    build:
      context: .
      dockerfile: MS.API/Dockerfile
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=HospitalDb;User Id=sa;Password=P@ssw0rd123!;TrustServerCertificate=True;
    ports:
      - "8080:8080"
  
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "P@ssw0rd123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1444:1433"
    volumes:
      - sql-data:/var/opt/mssql

volumes:
  sql-data: